name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        lfs: true

    - name: Setup Git LFS
      run: |
        git lfs install
        git lfs pull

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build

    - name: Cache build directory
      uses: actions/cache@v3
      with:
        path: build
        key: ${{ runner.os }}-build-${{ hashFiles('**/*.cc', '**/*.h', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Create build directory
      run: mkdir -p build

    # Enable problem matcher for compiler warnings
    - name: Enable Compiler Warning Problem Matcher
      run: echo "::add-matcher::.github/problem-matchers/gcc.json"

    - name: Configure CMake with Ninja
      working-directory: build
      run: cmake -GNinja ..

    # Capture warnings by treating them as annotations
    - name: Build
      working-directory: build
      # Force warnings to be shown in build output for problem matcher
      run: ninja -v

    - name: Run tests
      working-directory: build
      run: ./test/test_image_data
